    html: `
<h1>Datenschutzerklärung</h1>
<p class="eff">Gültig ab 30. September 2026</p>
<p class="lead">Heds Chäs? ist eine App, um Käse festzuhalten, zu bewerten und mit Freunden zu teilen. Sie wird von Maurin Dai in der Schweiz entwickelt. Maurin Dai ist verantwortlich für die Bearbeitung deiner Daten nach dem Schweizer Datenschutzgesetz (DSG) und, wo anwendbar, der EU-Datenschutz-Grundverordnung (DSGVO).</p>
<div class="summary"><p><strong>Kurz gesagt:</strong> Was du in Heds Chäs? teilst (dein Profil und deine Check-ins), wird in Apples iCloud gespeichert, damit deine Freunde es sehen können. Du kannst alles jederzeit direkt in der App löschen.</p></div>
<h2>Dein Konto</h2>
<p>Heds Chäs? braucht kein Passwort und keine E-Mail-Registrierung. Die App nutzt dein iCloud-Konto: Apple gibt der App eine anonyme Kennung für dein iCloud-Konto, damit sie dein Profil wiedererkennt. Die App sieht deine Apple-Account-E-Mail und deinen Namen nicht, ausser du gibst deinen Namen selbst im Profil ein.</p>
<h2>Was gespeichert wird und wer es sieht</h2>
<p>Folgendes wird in der Datenbank der App in Apples iCloud (öffentliche CloudKit-Datenbank) gespeichert:</p>
<ul>
<li><strong>Profil:</strong> Benutzername, Anzeigename sowie optional eine kurze Beschreibung, ein Profilbild, dein Heimatland oder -kanton und ob dein Profil privat ist.</li>
<li><strong>Check-ins:</strong> welchen Käse du probiert hast, deine Bewertung, Aromen, wo du ihn gekauft hast, eine optionale Notiz, ein optionales Foto und der Zeitpunkt.</li>
<li><strong>Follows:</strong> wem du folgst, wer dir folgt sowie Follow-Anfragen und deren Antworten.</li>
<li><strong>Beiträge zum Katalog:</strong> Käse und Produzenten (z. B. Käsereien), die du zum gemeinsamen Katalog hinzufügst.</li>
</ul>
<p>Diese Informationen sind für andere Nutzerinnen und Nutzer von Heds Chäs? sichtbar. Wenn dein Profil <strong>privat</strong> ist, zeigt die App deine Check-ins nur Personen, deren Follow-Anfrage du angenommen hast. Dieser Schutz wird von der App umgesetzt: Die Daten selbst liegen in derselben gemeinsamen iCloud-Datenbank wie alle anderen. Teile deshalb in einem Check-in nichts, was andere Nutzer nicht sehen sollen.</p>
<h2>Fotos</h2>
<p>Die App greift nur auf Fotos zu, die du selbst auswählst oder mit der Kamera aufnimmst. Vor dem Hochladen wird ein Foto verkleinert und seine Metadaten, einschliesslich eines allfälligen Standorts, werden entfernt. Auf den Rest deiner Fotomediathek greift die App nicht zu.</p>
<h2>Was nur für dich ist</h2>
<p>Deine Lieblingsproduzenten und deine Wunschliste werden in deinem persönlichen iCloud-Schlüssel-Wert-Speicher abgelegt. Nur du siehst sie; sie werden zwischen deinen eigenen Geräten synchronisiert.</p>
<h2>Wo deine Daten liegen</h2>
<p>Alle oben genannten Daten werden von Apple im Rahmen von iCloud/CloudKit gespeichert und bearbeitet, gemäss der <a href="${APPLE}">Datenschutzrichtlinie von Apple</a>. Apple kann Daten auf Servern ausserhalb der Schweiz speichern, auch in der EU und den USA. Der Entwickler betreibt keine eigenen Server und erhält keine Kopien deiner Daten.</p>
<h2>Wozu wir sie bearbeiten</h2>
<p>Nur um die Funktionen der App bereitzustellen: deine Check-ins anzeigen, Freunden das Folgen ermöglichen und einen gemeinsamen Käsekatalog aufbauen. Nach DSGVO ist die Rechtsgrundlage die Erbringung des von dir gewünschten Dienstes (Art. 6 Abs. 1 lit. b).</p>
<h2>Werbung und Analyse</h2>
<p>Die App enthält derzeit keine Werbung, keine Analyse-Tools und keine Software von Drittanbietern und greift nicht auf deine Kontakte, E-Mail-Adresse oder Telefonnummer zu. Sollte sich das ändern, passen wir diese Erklärung vorher an. Deine Daten werden nicht verkauft.</p>
<h2>Wie lange wir sie behalten und wie du sie löschst</h2>
<p>Deine Daten bleiben, bis du sie löschst. Einzelne Check-ins kannst du jederzeit löschen. Unter <strong>Einstellungen → Konto löschen</strong> löschst du dein Profil, dein Profilbild, deine Check-ins, Follows und Anfragen sowie deine privaten Listen sofort. Käse und Produzenten, die du zum gemeinsamen Katalog hinzugefügt hast, bleiben für andere verfügbar, sind aber mit keinem Profil mehr verknüpft.</p>
<h2>Deine Rechte</h2>
<p>Du kannst deine Daten direkt in der App einsehen und korrigieren. Du hast ausserdem das Recht auf Auskunft, Berichtigung und Löschung, auf Widerspruch gegen die Bearbeitung und auf Herausgabe deiner Daten. Melde dich dafür bei uns. Du kannst dich auch beim Eidgenössischen Datenschutz- und Öffentlichkeitsbeauftragten (EDÖB) oder in der EU bei deiner Datenschutzbehörde beschweren.</p>
<h2>Kinder</h2>
<p>Heds Chäs? richtet sich nicht an Kinder unter 16 Jahren.</p>
<h2>Änderungen</h2>
<p>Wenn sich diese Erklärung ändert, veröffentlichen wir die neue Version auf dieser Seite mit neuem Datum.</p>
<h2>Kontakt</h2>
<p>Maurin Dai · ${EMAIL}</p>`

<p class="eff">En vigueur depuis le 30 septembre 2026</p>
<p class="lead">Heds Chäs? est une app pour garder une trace des fromages, les noter et les partager avec ses amis. Elle est développée par Maurin Dai en Suisse, responsable du traitement de tes données selon la loi fédérale sur la protection des données (LPD) et, lorsqu'il s'applique, le règlement général européen sur la protection des données (RGPD).</p>

<h2>Ton compte</h2>
<p>Heds Chäs? ne demande ni mot de passe ni inscription par e-mail. L'app utilise ton compte iCloud : Apple lui fournit un identifiant anonyme de ton compte iCloud pour reconnaître ton profil. L'app ne voit ni l'adresse e-mail de ton compte Apple ni ton nom, sauf si tu saisis toi-même ton nom dans ton profil.</p>

<h2>Photos</h2>
<p>L'app n'accède qu'aux photos que tu choisis toi-même ou que tu prends avec l'appareil photo. Avant l'envoi, une photo est réduite et ses métadonnées, y compris une éventuelle localisation, sont supprimées. L'app n'accède pas au reste de ta photothèque.</p>
<h2>Ce qui reste privé</h2>
<p>Tes producteurs favoris et ta liste d'envies sont enregistrés dans ton stockage clé-valeur iCloud personnel. Toi seul·e les vois ; ils se synchronisent entre tes propres appareils.</p>
<h2>Où sont tes données</h2>
<p>Toutes les données ci-dessus sont enregistrées et traitées par Apple dans le cadre d'iCloud/CloudKit, conformément à la <a href="${APPLE}">politique de confidentialité d'Apple</a>. Apple peut stocker des données sur des serveurs situés hors de Suisse, notamment dans l'UE et aux États-Unis. Le développeur n'exploite aucun serveur propre et ne reçoit aucune copie de tes données.</p>
<h2>Pourquoi nous les traitons</h2>
<p>Uniquement pour fournir les fonctions de l'app : afficher tes check-ins, permettre à tes amis de te suivre et construire un catalogue de fromages commun. Selon le RGPD, la base légale est l'exécution du service que tu as demandé (art. 6, par. 1, let. b).</p>
<h2>Publicité et analyse</h2>
<p>L'app ne contient actuellement ni publicité, ni outils d'analyse, ni logiciel de tiers, et n'accède ni à tes contacts, ni à ton adresse e-mail, ni à ton numéro de téléphone. Si cela devait changer, nous adapterions d'abord cette politique. Tes données ne sont pas vendues.</p>
<h2>Durée de conservation et suppression</h2>
<p>Tes données restent enregistrées jusqu'à ce que tu les supprimes. Tu peux supprimer chaque check-in à tout moment. Sous <strong>Réglages → Supprimer le compte</strong>, tu supprimes immédiatement ton profil, ta photo, tes check-ins, tes abonnements et demandes, ainsi que tes listes privées. Les fromages et producteurs que tu as ajoutés au catalogue commun restent disponibles pour les autres, mais ne sont plus liés à aucun profil.</p>
<h2>Tes droits</h2>
<p>Tu peux consulter et corriger tes données directement dans l'app. Tu as aussi le droit d'obtenir des renseignements, de faire rectifier ou effacer tes données, de t'opposer à leur traitement et d'en recevoir une copie. Contacte-nous pour cela. Tu peux également t'adresser au Préposé fédéral à la protection des données et à la transparence (PFPDT) ou, dans l'UE, à ton autorité de protection des données.</p>
<h2>Enfants</h2>
<p>Heds Chäs? ne s'adresse pas aux enfants de moins de 16 ans.</p>
<h2>Modifications</h2>
<p>Si cette politique change, la nouvelle version sera publiée sur cette page avec une nouvelle date.</p>
<h2>Contact</h2>
<p>Maurin Dai · ${EMAIL}</p>`

<h1>Privacy Policy</h1>
<p class="eff">Effective 30 September 2026</p>
<p class="lead">Heds Chäs? is an app for keeping track of cheese, rating it and sharing it with friends. It is developed by Maurin Dai in Switzerland, who is responsible for the processing of your data under the Swiss Federal Act on Data Protection (FADP) and, where it applies, the EU General Data Protection Regulation (GDPR).</p>
<div class="summary"><p><strong>In short:</strong> what you share in Heds Chäs? (your profile and check-ins) is stored in Apple's iCloud so your friends can see it. You can delete everything from inside the app at any time.</p></div>
<h2>Your account</h2>
<p>Heds Chäs? has no password or email sign-up. It uses your iCloud account: Apple gives the app an anonymous identifier for your iCloud account, which lets it recognise your profile. The app never sees your Apple Account email address or name unless you type your name into your profile.</p>
<h2>What is stored, and who can see it</h2>
<p>The following is stored in the app's database on Apple's iCloud (CloudKit public database):</p>
<ul>
<li><strong>Profile:</strong> username, display name, and optionally a short bio, a profile photo, your home country or canton, and whether your profile is private.</li>
<li><strong>Check-ins:</strong> which cheese you tried, your rating, flavour tags, where you bought it, an optional note and an optional photo, and the time.</li>
<li><strong>Follows:</strong> whom you follow, who follows you, and follow requests with their answers.</li>
<li><strong>Catalog contributions:</strong> cheeses and producers (e.g. Käsereien) you add to the shared catalog.</li>
</ul>
<p>This information is visible to other people using Heds Chäs?. If your profile is <strong>private</strong>, the app only shows your check-ins to people whose follow request you accepted. This protection is enforced by the app: the data itself is stored in the same shared iCloud database as everyone else's, so don't post anything in a check-in you wouldn't want other users to see.</p>
<h2>Photos</h2>
<p>The app only accesses photos you actively choose or take with the camera. Before a photo is uploaded it is reduced in size and its metadata, including any location, is removed. The app does not read the rest of your photo library.</p>
<h2>What stays private to you</h2>
<p>Your favourite producers and your wishlist are stored in your own iCloud key-value storage. Only you can see them; they sync between your own devices.</p>
<h2>Where your data is stored</h2>
<p>All of the above is stored and processed by Apple as part of iCloud/CloudKit, under <a href="${APPLE}">Apple's Privacy Policy</a>. Apple may store data on servers outside Switzerland, including in the EU and the United States. The developer does not run any other servers and does not receive copies of your data.</p>
<h2>Why we process it</h2>
<p>Only to provide the app's features: showing your check-ins, letting friends follow you, and building a shared cheese catalog. Under the GDPR the legal basis is performance of the service you asked for (Art. 6(1)(b)).</p>
<h2>Advertising and analytics</h2>
<p>The app currently contains no advertising, no analytics tools and no third-party software, and it does not access your contacts, email address or phone number. If that changes, we will update this policy first. Your data is not sold.</p>

<p>Your data stays until you delete it. You can delete individual check-ins at any time. In <strong>Settings → Delete account</strong> you delete your profile, photo, check-ins, follows and requests, and your private lists, immediately. Cheeses and producers you added to the shared catalog remain available to others but are no longer linked to a profile.</p>
<h2>Your rights</h2>
<p>You can access and correct your data directly in the app. You also have the right to request information about, correction or deletion of your data, to object to processing, and to receive a copy of your data. To do so, contact us below. You may also complain to the Swiss Federal Data Protection and Information Commissioner (FDPIC) or, in the EU, to your local data protection authority.</p>
<h2>Children</h2>

<p>Maurin Dai · ${EMAIL}</p>`

const LANGS = ["de", "fr", "en"];
const switcher = document.getElementById("langSwitcher");
const langBtn = document.getElementById("langBtn");

function setLang(lang) {
  if (!LANGS.includes(lang)) lang = "de";
  const p = policies[lang];
  document.documentElement.lang = lang;
  document.title = p.title;
  document.getElementById("policy").innerHTML = p.html;
  document.querySelectorAll("[data-i18n]").forEach(el => { const v = p[el.getAttribute("data-i18n")]; if (v) el.textContent = v; });
  document.querySelectorAll(".lang-option").forEach(el => el.classList.toggle("active", el.dataset.lang === lang));
  langBtn.textContent = lang.toUpperCase() + " ▾";
  try { localStorage.setItem("hedschaes-lang", lang); } catch (e) {}
  switcher.classList.remove("open");
}

langBtn.addEventListener("click", e => { e.stopPropagation(); switcher.classList.toggle("open"); });
langBtn.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); switcher.classList.toggle("open"); } });
document.querySelectorAll(".lang-option").forEach(el => el.addEventListener("click", () => setLang(el.dataset.lang)));
document.addEventListener("click", () => switcher.classList.remove("open"));

let saved = null;
try { saved = localStorage.getItem("hedschaes-lang"); } catch (e) {}
setLang(new URLSearchParams(location.search).get("lang") || saved || "de");
</script>
<noscript><main><p>Please enable JavaScript to read this privacy policy, or contact maurin@maurinwidmer.ch.</p></main></noscript>
